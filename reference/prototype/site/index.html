<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PL Events — Prototype v1</title>
<meta name="description" content="PL Events plans and runs medical congresses, symposia, wetlabs and webinars for scientific societies, from Alexandria and Dubai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
.pl{--paper:#FAFAF7;--sand:#EFECE5;--surface:#FFFFFF;--line:#E2DED6;--cb:#8C8880;--ink:#0A0D18;--ink2:#161C30;--navy:#142040;--blue:#2C4894;--blueh:#233A78;--bsoft:#E6EBF7;--boi:#9DB2F2;--mut:#57534C;--oi:#FAFAF7;--oim:#B9BDC9;--live:#C62828;--liveoi:#E24C4C;--open:#1B7A4A;--soon:#8A5A00;
font-family:"Montserrat","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:17px;line-height:1.65}
.pl *{box-sizing:border-box}
.pl a{color:inherit}
.pl h1,.pl h2,.pl h3,.pl h4,.pl p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.m .wrap{padding:0 20px}
.lab{font-size:12px;line-height:1.4;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.em{font-style:italic;font-weight:500;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.03em;line-height:1}
.mut{color:var(--mut)}
.ink{background:var(--ink);color:var(--oi)}
.ink .mut{color:var(--oim)}
.sand{background:var(--sand)}
.btn{font:inherit;font-size:15px;font-weight:700;line-height:1.25;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;text-decoration:none;cursor:pointer;text-align:center;white-space:nowrap}
.pl .bp{background:var(--blue);color:#fff}
.pl .bp:hover{background:var(--blueh)}
.pl .bs{background:transparent;color:var(--ink);border-color:var(--ink)}
.pl .bw{background:var(--oi);color:var(--ink)}
.pl .bso{background:transparent;color:var(--oi);border-color:var(--oi)}
.pl .bg{background:transparent;color:var(--blue);padding:0 4px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.pl .ink .bg{color:var(--boi)}
.sm{min-height:40px;padding:0 16px;font-size:14px}
.ic{width:44px;min-height:44px;padding:0}
.pl .btn:focus-visible,.pl button:focus-visible,.pl select:focus-visible,.pl input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ink .btn:focus-visible,.ink button:focus-visible,.ink select:focus-visible{outline-color:var(--boi)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;border:1.5px solid currentColor;background:var(--surface);line-height:1}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.b-live{background:var(--live);border-color:var(--live);color:#fff}
.b-open{color:var(--open)}
.b-soon{color:var(--soon)}
.b-past{color:var(--mut)}
.b-past i{background:transparent;border:1.5px solid currentColor;width:7px;height:7px}
.date{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;padding:8px 8px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);text-align:center;line-height:1.1}
.date b{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.card{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(10,13,24,.06);min-width:0;position:relative}
.poster{position:relative;aspect-ratio:16/9;border-radius:8px 8px 0 0;overflow:hidden;background:linear-gradient(118deg,#142040 0 58%,#2C4894 58% 100%);color:#fff}
.poster.past{background:linear-gradient(118deg,#1B2235 0 58%,#3A4566 58% 100%)}
.pw{position:absolute;left:18px;top:16px;right:18px;font-weight:800;font-size:30px;line-height:.95;letter-spacing:-.03em;text-transform:uppercase;overflow-wrap:anywhere}
.pe{position:absolute;right:16px;bottom:16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C9D3F2;text-align:right;max-width:55%}
.poster .date{position:absolute;left:14px;bottom:14px}
.poster .badge{position:absolute;right:14px;top:14px}
.cb{display:flex;flex-direction:column;gap:8px;padding:18px 20px 20px;flex-grow:1}
.ct{font-size:18px;line-height:1.3;font-weight:700;overflow-wrap:anywhere;text-wrap:balance}
.cm{font-size:14px;line-height:1.45;font-weight:500;color:var(--mut);overflow-wrap:anywhere}
.ca{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:10px}
.save{font:inherit;width:44px;min-height:44px;border-radius:999px;border:1.5px solid var(--cb);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
.save.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vf{position:relative}
.vf::before{content:"";position:absolute;inset:-10px;pointer-events:none;color:var(--ink);z-index:2;background:linear-gradient(currentColor,currentColor) top left/24px 3px no-repeat,linear-gradient(currentColor,currentColor) top left/3px 24px no-repeat,linear-gradient(currentColor,currentColor) top right/24px 3px no-repeat,linear-gradient(currentColor,currentColor) top right/3px 24px no-repeat,linear-gradient(currentColor,currentColor) bottom left/24px 3px no-repeat,linear-gradient(currentColor,currentColor) bottom left/3px 24px no-repeat,linear-gradient(currentColor,currentColor) bottom right/24px 3px no-repeat,linear-gradient(currentColor,currentColor) bottom right/3px 24px no-repeat}
.vfw::before{color:#fff;inset:0;background-size:44px 3px,3px 44px,44px 3px,3px 44px,44px 3px,3px 44px,44px 3px,3px 44px}
.vfoi::before{color:var(--oi)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);flex-wrap:wrap}
.tab{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:0 16px;border:none;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--oi)}
.tab .n{opacity:.65;font-weight:600}
.chip{font:inherit;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 6px 0 14px;border-radius:999px;border:1.5px solid var(--blue);background:var(--bsoft);color:var(--blue);font-size:13px;font-weight:700;cursor:pointer}
.chip .x{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.choice{font:inherit;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.choice.on{background:var(--ink);color:var(--oi)}
.ink .choice{border-color:#5A6178;background:transparent;color:var(--oi)}
.ink .choice.on{background:var(--oi);color:var(--ink);border-color:var(--oi)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:13px;font-weight:700}
.sel,.inp{font:inherit;font-size:16px;font-weight:500;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--cb);background:var(--surface);color:var(--ink);width:100%}
.ink .sel{background:var(--ink2);color:var(--oi);border-color:#5A6178}
.search{border-radius:999px;padding-left:44px}
.flag{display:inline-block;width:20px;height:14px;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(10,13,24,.15);flex-shrink:0}
.f-EG{background:radial-gradient(circle,#C09300 0 2px,transparent 2.5px),linear-gradient(#CE1126 0 33.3%,#fff 33.3% 66.6%,#000 66.6%)}
.f-IQ{background:radial-gradient(circle,#007A3D 0 2px,transparent 2.5px),linear-gradient(#CE1126 0 33.3%,#fff 33.3% 66.6%,#000 66.6%)}
.f-AE{background:linear-gradient(90deg,#FF0000 0 26%,transparent 26%),linear-gradient(#00732F 0 33.3%,#fff 33.3% 66.6%,#000 66.6%)}
.f-SA{background:linear-gradient(transparent 60%,#fff 60% 66%,transparent 66%) 30% 0/40% 100% no-repeat,#006C35}
.f-TN{background:radial-gradient(circle,#E70013 0 2.2px,#fff 2.4px 4.6px,transparent 4.8px),#E70013}
.smp{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:4px;background:#FFE3A3;color:#5C3D00;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.nosmp .smp{display:none}
.out{color:transparent;-webkit-text-stroke:2px var(--ink);font-weight:800;letter-spacing:-.06em;line-height:.78}
.cutb{clip-path:polygon(0 0,100% 0,100% calc(100% - 48px),0 100%)}
.cutt{clip-path:polygon(0 48px,100% 0,100% 100%,0 100%)}
.m .cutb{clip-path:polygon(0 0,100% 0,100% calc(100% - 24px),0 100%)}
.m .cutt{clip-path:polygon(0 24px,100% 0,100% 100%,0 100%)}
.wm{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:19px;letter-spacing:.02em;line-height:1}
.wm b{font-weight:800}
.wm span{font-weight:400}
.nav a{text-decoration:none;font-weight:700;font-size:15px}
.nav a:hover{text-decoration:underline;text-underline-offset:4px}
.tile{display:flex;align-items:center;justify-content:center;min-height:72px;padding:10px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;letter-spacing:.02em;text-align:center;line-height:1.2;color:#3D4152}
.ink .tile{background:var(--ink2);border-color:#2A3149;color:var(--oim)}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.photo{display:block;width:100%;object-fit:cover}
.mapbg{background-color:var(--navy);background-repeat:no-repeat}
.sheet{box-shadow:0 12px 32px rgba(10,13,24,.14)}
.erow{display:grid;grid-template-columns:150px minmax(0,1fr) 210px 150px auto;gap:20px;align-items:center;padding:16px 0;border-top:1.5px solid var(--line)}
.m .erow{grid-template-columns:minmax(0,1fr) auto;gap:10px}

html,body{margin:0;background:#FAFAF7}
html{overflow-x:clip;scroll-behavior:auto}
body{overflow-x:clip}
.pl{overflow:visible;min-height:100vh}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--oi);padding:10px 16px;border-radius:999px;font-weight:700}
.skip:focus{top:12px}
img{max-width:100%}
/* header */
.topbar{position:sticky;top:0;z-index:40}.topbar.fx{position:fixed;left:0;right:0}
.hdr{position:relative;background:var(--paper);border-bottom:1.5px solid var(--line);transition:background-color .2s,border-color .2s,color .2s}
.hdr .in{display:flex;align-items:center;gap:24px;height:76px}
.hdr .nav{display:flex;gap:24px;flex-grow:1;margin-left:8px}
.hdr .nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.hdr .acts{display:flex;gap:10px;align-items:center}
.hdr .mk-w{display:none}
.hdr.over{background:transparent;border-color:transparent;color:var(--oi)}
.hdr.over .mk-w{display:block}.hdr.over .mk-i{display:none}
.pl .hdr.over .bs{color:var(--oi);border-color:var(--oi)}
.pl .hdr.over .bp{background:var(--oi);color:var(--ink)}
.menu-btn{display:none}
@media (max-width:1023px){.hdr .nav,.hdr .acts .bs{display:none}.menu-btn{display:inline-flex}.hdr .in{height:64px;gap:8px}.hdr .wm{flex-grow:1}}
.mmenu{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;padding:16px 20px 28px;gap:6px;overflow:auto}
.mmenu a.l{font-size:28px;font-weight:800;letter-spacing:-.02em;text-decoration:none;padding:10px 0;border-bottom:1.5px solid var(--line)}
.mmenu[hidden]{display:none}
/* live ribbon */
.ribbon{background:var(--paper);border-bottom:1.5px solid var(--line);position:relative;z-index:41}
.ribbon .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;padding-top:6px;padding-bottom:6px;font-size:14px;line-height:1.4}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--live);display:inline-block;flex-shrink:0}
.ink .ldot{background:var(--liveoi)}
[data-motion="full"] .ldot,[data-motion="light"] .ldot{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{opacity:.35}}
/* sections */
.sec{padding:96px 0}
.m-only{display:none}
@media (max-width:767px){.sec{padding:56px 0}.d-only{display:none!important}.m-only{display:revert}}
.h1{font-size:88px;line-height:.92;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.h2{font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.h3{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.lead{font-size:20px;line-height:1.55;max-width:62ch}
@media (max-width:767px){.h1{font-size:52px}.h2{font-size:32px}.h3{font-size:22px}.lead{font-size:17px}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:1023px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){.grid3{grid-template-columns:minmax(0,1fr);gap:18px}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
/* hero */
.hero{position:relative;min-height:calc(100vh - 0px);min-height:max(760px,100svh);overflow:hidden;background:var(--paper);color:var(--oi)}
.hero .media{position:absolute;inset:0}
.iris{position:absolute;border-radius:50%;overflow:hidden;will-change:transform}
.iris-in{position:absolute;will-change:transform}
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.still.on{opacity:1}
.shade{position:absolute;inset:0;background:rgba(10,13,24,.6)}
.hero .copy{position:relative;z-index:3;padding-top:150px;padding-bottom:150px}
.hero h1{font-size:124px;line-height:.9;font-weight:800;letter-spacing:-.045em}
@media (max-width:1023px){.hero h1{font-size:76px}.hero .copy{padding-top:100px;padding-bottom:40px}}
@media (max-width:767px){.hero h1{font-size:60px}.hero{min-height:0}}
.figbar{position:absolute;left:0;right:0;bottom:0;z-index:3;border-top:1.5px solid rgba(250,250,247,.22);background:rgba(10,13,24,.78)}
.figbar .in{display:flex;gap:24px;align-items:center;justify-content:space-between;min-height:92px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
@media (max-width:1023px){.figbar{position:relative}}
.brk{position:absolute;inset:0;pointer-events:none}
/* event card extras */
.ic-btn{font:inherit;width:44px;height:44px;min-height:44px;border-radius:999px;border:1.5px solid var(--cb);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.ic-btn:hover{border-color:var(--ink)}
.ca .push{margin-left:auto}
.card .badge{position:absolute;right:14px;top:14px;z-index:3}
.card{transition:border-color .15s}
.card:hover{border-color:var(--cb)}
/* events bar */
.ebar{position:sticky;top:var(--top,76px);z-index:30;background:var(--paper);border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.ebar .in{display:flex;flex-direction:column;gap:14px;padding-top:14px;padding-bottom:14px}
.frow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;align-items:end}
@media (max-width:1023px){.frow{display:none}}
.sbox{position:relative;flex:1 1 260px;display:block}
.sbox svg{position:absolute;left:16px;top:15px}
.vf-float{position:absolute;left:0;top:0;pointer-events:none;z-index:5;color:var(--ink)}
.vf-float::before{content:"";position:absolute;inset:-10px;background:linear-gradient(currentColor,currentColor) top left/24px 3px no-repeat,linear-gradient(currentColor,currentColor) top left/3px 24px no-repeat,linear-gradient(currentColor,currentColor) top right/24px 3px no-repeat,linear-gradient(currentColor,currentColor) top right/3px 24px no-repeat,linear-gradient(currentColor,currentColor) bottom left/24px 3px no-repeat,linear-gradient(currentColor,currentColor) bottom left/3px 24px no-repeat,linear-gradient(currentColor,currentColor) bottom right/24px 3px no-repeat,linear-gradient(currentColor,currentColor) bottom right/3px 24px no-repeat}
[data-motion="reduced"] .vf-float{display:none}
.results{position:relative}
/* sheet */
.backdrop{position:fixed;inset:0;z-index:70;background:rgba(10,13,24,.45);opacity:0;transition:opacity .2s}
.sheetp{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--paper);border-radius:18px 18px 0 0;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 12px 32px rgba(10,13,24,.14)}
.sheet-open .backdrop{opacity:1}.sheet-open .sheetp{transform:none}
[data-motion="reduced"] .sheetp{transition:opacity .15s;transform:none;opacity:0}
[data-motion="reduced"] .sheet-open .sheetp{opacity:1}
/* modal */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:24px}
.modal[hidden]{display:none}
.modal .box{width:min(960px,100%);background:#000;border-radius:12px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:12px}
/* map */
.map{position:relative;border-radius:10px;overflow:hidden;background:var(--navy)}
.map svg{display:block;width:100%;height:auto}
.arc{fill:none;stroke:#9DB2F2;stroke-width:1.6;stroke-linecap:round}
.pin text{font-family:Montserrat,sans-serif}
.story{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:32px;align-items:start}
.story .mapcol{grid-column:span 8}.story .side{grid-column:span 4}
@media (max-width:1023px){.story{display:flex;flex-direction:column;gap:20px}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:767px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-right:-20px;padding-right:20px}}
/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form .full{grid-column:1/-1}
@media (max-width:767px){.form{grid-template-columns:minmax(0,1fr)}}
textarea.inp{min-height:140px;padding:12px 14px;resize:vertical}
.note{padding:14px 18px;border-radius:10px;background:var(--bsoft);color:var(--ink);font-size:15px;font-weight:600}
/* prototype controls */
.pc-btn{position:fixed;left:16px;bottom:16px;z-index:90;font:700 13px/1 Montserrat,sans-serif;background:#FFE3A3;color:#5C3D00;border:1.5px solid #C99A2E;border-radius:999px;min-height:40px;padding:0 16px;cursor:pointer;box-shadow:0 12px 32px rgba(10,13,24,.14)}
.pc{position:fixed;left:16px;bottom:64px;z-index:91;width:min(380px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:#FFFBEF;border:1.5px solid #C99A2E;border-radius:14px;padding:16px;font-size:14px;line-height:1.45;box-shadow:0 12px 32px rgba(10,13,24,.2);display:flex;flex-direction:column;gap:12px}
.pc[hidden]{display:none}
.pc h3{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.08em}
.pc .sel{min-height:40px;font-size:14px}
.pc label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.pc .evlist{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto;border:1px solid #E7D7A8;border-radius:8px;padding:8px;background:#fff}
/* page enter */
main:focus{outline:none}
.ev-hero{background:var(--ink);color:var(--oi)}
.dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;font-size:15px;line-height:1.45}
.dl dt{color:var(--mut);font-weight:600}.ink .dl dt{color:var(--oim)}
.dl dd{margin:0;font-weight:700}
.svc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:32px;align-items:center;padding:48px 0;border-top:1.5px solid var(--line)}
.svc .ph{grid-column:span 5}.svc .tx{grid-column:span 7}
@media (max-width:767px){.svc{display:flex;flex-direction:column;align-items:stretch;gap:18px;padding:32px 0}}
.svc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:17px}

<div style="aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;background:#111"><img src="assets/av-stage.jpg" alt="" style="width:100%;height:100%;object-fit:cover;opacity:.55"><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px"><span class="smp">Sample</span><span style="font-size:18px;font-weight:700">The 45-second film plays here once PL sends real congress footage.</span><span style="font-size:14px;color:#B9BDC9">The file loads only when this window opens; captions on by default.</span></div></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
/* ===== PL data layer (prototype) — mirrors pl-events-core: one JSON in, everything computed ===== */
const PL = { raw: null, removed: new Set(), sampleOn: false, sim: '', showSample: true, motionOverride: 'auto' };
const M3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uniq = (a) => a.filter((x, i) => a.indexOf(x) === i);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

function nowDate() { return PL.sim ? new Date(PL.sim + 'T12:00:00Z') : new Date(); }
function localDay(tz, d) {
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d); }
  catch (e) { return d.toISOString().slice(0, 10); }
}
function parts(iso) { const [y, m, d] = iso.split('-').map(Number); return { y, m: m - 1, d }; }
function dayDiff(a, b) { return Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 864e5); }
function ymd(iso) { const p = parts(iso); return [p.y, p.m, p.d]; }

function dateText(s, e) {
  const a = parts(s), b = parts(e);
  if (s === e) return a.d + ' ' + M3[a.m] + ' ' + a.y;
  if (a.y === b.y && a.m === b.m) return a.d + '–' + b.d + ' ' + M3[a.m] + ' ' + a.y;
  if (a.y === b.y) return a.d + ' ' + M3[a.m] + ' – ' + b.d + ' ' + M3[b.m] + ' ' + b.y;
  return a.d + ' ' + M3[a.m] + ' ' + a.y + ' – ' + b.d + ' ' + M3[b.m] + ' ' + b.y;
}

/* Build the computed model from the raw JSON. Called after every data change. */
function model() {
  const R = PL.raw, G = R.geo, NOW = nowDate();
  let src = R.events.slice();
  if (PL.sampleOn && R._sample_event) src.push(R._sample_event);
  src = src.filter((e) => e.show_on_site && !PL.removed.has(e.id));
  const evs = src.map((e) => {
    const c = G.countries[e.country] || { name: e.country, tz: 'UTC', centre: [30, 30] };
    const today = localDay(c.tz, NOW);
    const st = today > e.end ? 'past' : today >= e.start ? 'live' : 'upcoming';
    const a = parts(e.start), b = parts(e.end);
    const canReg = st !== 'past' && e.registration === 'open' && /^https?:\/\//.test(e.registration_url || '');
    const badge = st === 'live' ? ['Live now', 'b-live'] : st === 'past' ? ['Held ' + M3[a.m] + ' ' + a.y, 'b-past'] : canReg ? ['Registration open', 'b-open'] : ['Registration opens soon', 'b-soon'];
    const pt = G.cities[e.city] || c.centre;
    const dayN = st === 'live' ? dayDiff(e.start, today) + 1 : 0, dayT = dayDiff(e.start, e.end) + 1;
    return Object.assign({}, e, {
      st, today, year: a.y, monthShort: M3[a.m] + ' ' + a.y, range: dateText(e.start, e.end),
      tileD: e.start === e.end ? String(a.d) : (a.m === b.m ? a.d + '–' + b.d : a.d + ' ' + M3[a.m].slice(0, 3)), tileMY: a.m === b.m || e.start === e.end ? M3[a.m] + ' ' + a.y : '– ' + b.d + ' ' + M3[b.m] + ' ' + b.y,
      countryName: c.name, place: e.city + ', ' + c.name, canReg, badge, lonlat: pt, onCentre: !G.cities[e.city],
      regLabel: 'Register for ' + (e.series === 'Bridge Retina' ? 'BRC' : e.series) + ' ' + a.y,
      specLine: e.type + ' · ' + e.specialties.join(', '), liveDay: st === 'live' ? 'day ' + dayN + ' of ' + dayT : '',
      posterWord: e.series.length > 12 ? e.series.replace(/([a-z])([A-Z])/g, '$1 $2') : e.series, posterEd: e.edition
    });
  }).sort((x, y) => (x.start < y.start ? -1 : 1));
  const live = evs.filter((e) => e.st === 'live'), upcoming = evs.filter((e) => e.st === 'upcoming'), past = evs.filter((e) => e.st === 'past').reverse();
  const countries = uniq(evs.map((e) => e.country)), cities = uniq(evs.map((e) => e.city));
  const first = evs[0];
  return {
    NOW, evs, live, upcoming, past, ordered: live.concat(upcoming, past), countries, cities,
    since: first ? M3[parts(first.start).m] + ' ' + first.year : '—', sinceLong: first ? MF[parts(first.start).m] + ' ' + first.year : '—',
    specs: uniq(evs.reduce((a, e) => a.concat(e.specialties), [])), types: uniq(evs.map((e) => e.type)), years: uniq(evs.map((e) => e.year)),
    cn: (cc) => (G.countries[cc] || { name: cc }).name, word: (n) => WORDS[n] || String(n)
  };
}

/* Map projection shared by hero/story/explorer (equirectangular, same as v0.1 dots). */
const proj = (ll) => [(ll[0] + 14) * 10, (52 - ll[1]) * 10];
function arcPath(a, b) {
  const [x1, y1] = proj(a), [x2, y2] = proj(b); const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
  const lift = Math.max(20, len * 0.3); return 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' Q' + mx.toFixed(1) + ',' + (my - lift).toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1);
}
/* Google Calendar link (all-day). Downloads (.ics) are blocked inside the artifact frame; the build serves .ics from the plugin. */
function gcalUrl(e) {
  const end = new Date(Date.UTC(...ymd(e.end)) + 864e5).toISOString().slice(0, 10).replace(/-/g, '');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(e.name) + '&dates=' + e.start.replace(/-/g, '') + '/' + end + '&location=' + encodeURIComponent(e.venue + ', ' + e.place) + '&details=' + encodeURIComponent((e.website || '') + ' — organised by PL Events');
}
function waUrl(e) { return 'https://wa.me/?text=' + encodeURIComponent(e.name + ' · ' + e.range + ' · ' + e.place + ' — https://plevents.org/events/' + e.id + '/'); }
function flag(cc, big) { return '<span class="flag f-' + esc(cc) + '" aria-hidden="true"' + (big ? ' style="width:30px;height:21px"' : '') + '></span>'; }

const HEADLINES = [
  { id: 'stage', text: 'Your science.', em: 'Our stage.' },
  { id: 'remember', text: 'Congresses doctors', em: 'remember.' },
  { id: 'meets', text: 'Where medicine', em: 'meets.' },
  { id: 'focus', text: 'Science', em: 'in focus.' }
];
function heroHL() { const o = PL.headline && HEADLINES.find((h) => h.id === PL.headline); return o || PL.raw.company.hero_headline || HEADLINES[0]; }

/* ===== Views: each returns HTML from the computed model. Same section order and class names as the approved hi-fi. ===== */
const I = {

/* viewBox (aspect 2.1) that frames a set of lon/lat points; min width keeps labels readable when zoomed in */
function viewBoxFor(lls, minW, aspect) {
  const all = lls.map(proj); minW = minW || 300; aspect = aspect || 2.1;
  let x0 = Math.min(...all.map((p) => p[0])) - 70, x1 = Math.max(...all.map((p) => p[0])) + 90, y0 = Math.min(...all.map((p) => p[1])) - 70, y1 = Math.max(...all.map((p) => p[1])) + 60;
  let w = Math.max(minW, x1 - x0, (y1 - y0) * aspect), h = w / aspect;
  if (h > 469) { h = 469; w = h * aspect; }
  x0 = Math.max(0, Math.min(783.5 - w, (x0 + x1) / 2 - w / 2)); y0 = Math.max(0, Math.min(469 - h, (y0 + y1) / 2 - h / 2));
  return [x0, y0, w, h].map((n) => n.toFixed(1)).join(' ');
}

  const vb = viewBoxFor(pts.map((p) => p.ll).concat([hq]), 300, opt.aspect), [x0, y0, w, h] = vb.split(' ').map(Number);

    .map((p) => '<path class="arc" data-city="' + esc(p.c) + '" data-cc="' + p.cc + '" d="' + arcPath(hq, p.ll) + '"/>').join('');
  const L = { Alexandria: [12, -10, 'start'], 'New Alamein': [-10, 16, 'end'], Tunis: [-10, -10, 'end'], Jeddah: [-10, 14, 'end'], Luxor: [10, 14, 'start'] };
  const pins = pts.map((p) => { const [x, y] = proj(p.ll); const l = L[p.c] || [10, -10, 'start']; const hqp = p.c === 'Alexandria'; const sub = hqp ? 'Head office' : p.c === 'Dubai' ? 'Regional office' : D.cn(p.cc);
    return '<g class="pin" data-city="' + esc(p.c) + '" data-cc="' + p.cc + '"><circle class="ring" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="none" stroke="#FAFAF7" stroke-width="1" opacity="0"/><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (hqp ? 5 : 4) + '" fill="' + (hqp ? '#FAFAF7' : '#9DB2F2') + '" stroke="#0A0D18" stroke-width="1.2"/>' +

}

const Motion = {

  ctxName() { return PL.motionOverride && PL.motionOverride !== 'auto' ? PL.motionOverride : this.detected(); },
  kill() {

  },
  /* P11 — header transparent over the hero, solid once the hero leaves */
  headerState(route) {

  /* M1 — iris hero. Wrapper scales about the aperture point; the media inside counter-scales so the picture never zooms. */
  irisLayout() {

    const move = (card) => {
      if (!card) return; vf.style.width = card.offsetWidth + 'px'; vf.style.height = card.offsetHeight + 'px';
      if (window.gsap) gsap.to(vf, { x: card.offsetLeft, y: card.offsetTop, duration: C === 'full' ? 0.4 : 0, ease: 'power3.out', overwrite: true }); else vf.style.transform = 'translate(' + card.offsetLeft + 'px,' + card.offsetTop + 'px)';
    };
    const cards = Array.from(document.querySelectorAll('#results .card')); move(cards[0]);
    this.io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) move(e.target); }); }, { rootMargin: '-45% 0px -45% 0px' });
    cards.forEach((c) => { this.io.observe(c); c.addEventListener('focusin', () => move(c)); });
  },
  /* M3 — story map: pinned chapters (Full), then the explorer */
  /* M3 (v1.3) — no JS pin: the map is CSS-sticky, chapters scroll natively; an observer picks the step in focus */
  story(C) {
    const steps = Array.from(document.querySelectorAll('.step')); if (!steps.length) return;
    const chs = chapters(D), A = PL.state.about;
    if (!document.querySelector('.step[data-ch]')) { A.mode = 'explore'; this.mapState({ mode: 'explore', cc: A.cc }); return; }
    this.mapState({ mode: 'story', ch: chs[0], chs });
    this.io2 = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return;
      const el = e.target;
      if (el.dataset.explore) { if (A.mode !== 'explore') { A.mode = 'explore'; this.mapState({ mode: 'explore', cc: A.cc }); } }
      else { const i = +el.dataset.ch; if (A.mode !== 'story' || A.ch !== i) { A.mode = 'story'; A.ch = i; this.mapState({ mode: 'story', ch: chs[i], chs }); } }
      steps.forEach((s) => s.classList.toggle('on', s === el));
    }), { rootMargin: '-45% 0px -45% 0px' });
    steps.forEach((s) => this.io2.observe(s));
  },
  mapState(st) {
    const C = this.ctxName(), anim = window.gsap && C !== 'reduced';
    const svg = document.querySelector('#mapWrap svg'); if (!svg) return;
    let active = null, fresh = [];
    if (st.mode === 'story') {
      active = D.evs.filter((e) => e.year <= st.ch.to).map((e) => e.city);
      const before = D.evs.filter((e) => e.year < st.ch.from).map((e) => e.city); fresh = uniq(active).filter((c) => before.indexOf(c) < 0);
      active.push('Alexandria');
    }
    const hq = PL.raw.geo.cities.Alexandria, ll = (cities) => uniq(cities).map((c) => (D.evs.find((e) => e.city === c) || { lonlat: hq }).lonlat).concat([hq]);
    const asp = +svg.dataset.aspect || 2.1;
    const vb = st.mode === 'story' ? viewBoxFor(ll(active), 330, asp) : st.cc ? viewBoxFor(ll(D.evs.filter((e) => e.country === st.cc).map((e) => e.city)), 330, asp) : svg.dataset.full;
    /* keep city labels the same size on screen while the camera zooms */
    const k = vb ? (+vb.split(' ')[2]) / Math.max(1, svg.clientWidth) : 1, fl = (13 * k).toFixed(1), fs = (9.5 * k).toFixed(1);
    const lab = svg.querySelectorAll('.ml'), sub = svg.querySelectorAll('.ms');
    if (vb && svg.getAttribute('viewBox') !== vb) {
      if (anim) { const d = C === 'full' ? 1.2 : 0.4; gsap.to(svg, { attr: { viewBox: vb }, duration: d, ease: 'power2.inOut', overwrite: true }); gsap.to(lab, { attr: { 'font-size': fl }, duration: d, ease: 'power2.inOut' }); gsap.to(sub, { attr: { 'font-size': fs }, duration: d, ease: 'power2.inOut' }); }
      else { svg.setAttribute('viewBox', vb); lab.forEach((t) => t.setAttribute('font-size', fl)); sub.forEach((t) => t.setAttribute('font-size', fs)); }
    } else if (vb) { lab.forEach((t) => t.setAttribute('font-size', fl)); sub.forEach((t) => t.setAttribute('font-size', fs)); }
    svg.querySelectorAll('.arc').forEach((p) => {
      const len = p.getTotalLength(); p.style.strokeDasharray = len;
      const on = !active || active.indexOf(p.dataset.city) >= 0, dim = st.mode === 'explore' && st.cc && p.dataset.cc !== st.cc;
      const target = on ? 0 : len, prev = p.dataset.drawn === '1';
      if (anim && C === 'full' && on && !prev && st.mode === 'story') { gsap.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.out' }); }
      else p.style.strokeDashoffset = target;
      p.dataset.drawn = on ? '1' : '0';
      if (anim) gsap.to(p, { opacity: dim ? 0.2 : 0.95, duration: 0.4 }); else p.style.opacity = dim ? 0.2 : 0.95;
    });
    svg.querySelectorAll('.pin').forEach((g) => {
      const on = !active || active.indexOf(g.dataset.city) >= 0, dim = st.mode === 'explore' && st.cc && g.dataset.cc !== st.cc && g.dataset.city !== 'Alexandria';
      const op = !on ? 0 : dim ? 0.3 : 1;
      if (anim) gsap.to(g, { opacity: op, duration: 0.4 }); else g.style.opacity = op;
      const ring = g.querySelector('.ring');
      if (anim && C === 'full' && fresh.indexOf(g.dataset.city) >= 0) gsap.fromTo(ring, { attr: { r: 4 }, opacity: 0.9 }, { attr: { r: 16 }, opacity: 0, duration: 0.8, ease: 'power1.out' });
    });
  },
  /* P7 — mobile filters sheet */
  sheet(open) {
    const s = document.getElementById('sheet'); if (!s) return;
    if (open) { s.classList.add('sheet-open'); document.body.style.overflow = 'hidden'; const f = s.querySelector('select'); f && setTimeout(() => f.focus(), 50); this._sheetOpener = document.activeElement; }
    else if (s.classList.contains('sheet-open')) { s.classList.remove('sheet-open'); document.body.style.overflow = ''; const b = document.querySelector('[data-act="sheet"]'); b && b.focus(); }
  },
  /* P13 — film modal */
  film(open, opener) {
    const m = document.getElementById('film'); if (!m) return;
    if (open) { this._filmOpener = opener; m.hidden = false; if (this.lenis) this.lenis.stop(); const box = m.querySelector('.box'); if (window.gsap && this.ctxName() !== 'reduced') gsap.fromTo(box, { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.25 }); m.querySelector('button').focus(); }
    else if (!m.hidden) { m.hidden = true; if (this.lenis) this.lenis.start(); this._filmOpener && this._filmOpener.focus(); }
  }
};
window.addEventListener('resize', () => { Motion.setTop(); if (route === 'events') Motion.viewfinder(); });

/* ===== App: router (#name only, per artifact rules), state, handlers, prototype controls ===== */
PL.state = { ht: 'all', ev: { tab: 'all', view: 'grid', q: '', f: { spec: '', cc: '', year: '', type: '' } }, help: { role: 'doctor', spec: '', where: 'Anywhere' }, about: { mode: 'story', ch: 0, cc: '' }, contact: { topic: 'proposal', office: 'alexandria' } };
const ROUTES = ['home', 'events', 'about', 'services', 'careers', 'contact', 'privacy'];
const TITLES = { home: 'PL Events — Medical congress organiser', events: 'Events — PL Events', about: 'About — PL Events', services: 'Services — PL Events', careers: 'Careers — PL Events', contact: 'Contact — PL Events', privacy: 'Privacy — PL Events' };
let D = null, route = 'home', stillTimer = null;
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function parseRoute() {
  const h = (location.hash || '').slice(1);
  if (h.indexOf('event-') === 0) return { r: 'event', id: h.slice(6) };
  if (h === 'our-congresses') return { r: 'home', anchor: 'congresses' };
  return { r: ROUTES.indexOf(h) >= 0 ? h : 'home' };
}
function render(keepScroll) {
  Motion.kill();
  D = model();
  const p = parseRoute(); route = p.r;
  const over = route === 'home';
  $('#shell').innerHTML = header(route, D, over);
  const main = $('#main');
  main.innerHTML = route === 'event' ? V.event(D, p.id) : V[route](D, PL.state);
  $('#foot').innerHTML = footer(route);
  document.title = route === 'event' ? ((D.evs.find((e) => e.id === p.id) || { name: 'Event' }).name + ' — PL Events') : TITLES[route];
  if (route === 'events') renderResults(true);
  if (route === 'about') aboutPanel();
  if (route === 'home') startStills();
  else stopStills();
  renderControls();
  if (!keepScroll) window.scrollTo(0, 0);
  Motion.init(route);
  if (p.anchor) setTimeout(() => { const t = document.getElementById(p.anchor); t && t.scrollIntoView(); }, 50);
}
function renderResults(first) {
  const R = eventsResults(D, PL.state);
  const box = $('#results'); if (!box) return;
  box.innerHTML = R.html; $('#count').textContent = R.count; $('#chips').innerHTML = R.chips;
  const go = $('#sheetGo'); if (go) go.textContent = 'Show ' + R.count;
  const fb = $('[data-act="sheet"]'); if (fb) fb.textContent = 'Filters (' + Object.values(PL.state.ev.f).filter(Boolean).length + ')';
  if (!first) Motion.swap(box);
  Motion.viewfinder();
}
function aboutPanel() {
  const A = PL.state.about, side = $('#side'); if (!side) return;
  $('#cchips').innerHTML = [['', 'All countries', D.evs.length]].concat(D.countries.map((c) => [c, D.cn(c), D.evs.filter((e) => e.country === c).length])).map((c) => '<button type="button" class="choice' + (A.cc === c[0] ? ' on' : '') + '" aria-pressed="' + (A.cc === c[0]) + '" data-cc="' + c[0] + '">' + (c[0] ? flag(c[0]) : '') + esc(c[1]) + ' <span style="opacity:.65">' + c[2] + '</span></button>').join('');
  side.innerHTML = exploreSide(D, A.cc);
  if (A.mode === 'explore') Motion.mapState({ mode: 'explore', cc: A.cc });
}

/* hero stand-in showreel: crossfade between real portfolio stills (Sample) */
function startStills() {
  stopStills(); const ctx = Motion.ctxName(); if (ctx !== 'full' || PL.paused) return;
  let i = 0; stillTimer = setInterval(() => { const s = $$('.still'); if (!s.length) return; s[i].classList.remove('on'); i = (i + 1) % s.length; s[i].classList.add('on'); }, 5000);
}
function stopStills() { if (stillTimer) clearInterval(stillTimer); stillTimer = null; }

/* ---- events (delegation) ---- */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act],[data-ht],[data-tab],[data-view],[data-role],[data-unchip],[data-cc],[data-prefill],[data-preset-spec],[data-preset-cc],[data-pc]');
  if (!t) { const sc = ev.target.closest('[data-scroll]'); if (sc) { ev.preventDefault(); const el = document.getElementById(sc.dataset.scroll); if (el) { if (Motion.lenis) Motion.lenis.scrollTo(el, { offset: -76 }); else el.scrollIntoView({ behavior: Motion.ctxName() === 'reduced' ? 'auto' : 'smooth' }); } } return; }
  const S = PL.state;
  if (t.dataset.prefill) { S.contact.topic = t.dataset.prefill; if (t.dataset.office) S.contact.office = t.dataset.office; }
  if (t.dataset.presetSpec !== undefined) { S.ev = { tab: 'all', view: S.ev.view, q: '', f: { spec: t.dataset.presetSpec, cc: '', year: '', type: '' } }; }
  if (t.dataset.presetCc !== undefined) { S.ev = { tab: 'all', view: S.ev.view, q: '', f: { spec: '', cc: t.dataset.presetCc, year: '', type: '' } }; }
  if (t.dataset.ht) { S.ht = t.dataset.ht; const m = $('#main'); const scroll = window.scrollY; m.innerHTML = V.home(D, S); window.scrollTo(0, scroll); Motion.init('home', true); startStills(); return; }
  if (t.dataset.tab) { S.ev.tab = t.dataset.tab; $$('[data-tab]').forEach((b) => { const on = b.dataset.tab === S.ev.tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); }); renderResults(); return; }
  if (t.dataset.view) { S.ev.view = t.dataset.view; $$('[data-view]').forEach((b) => { const on = b.dataset.view === S.ev.view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); renderResults(); return; }
  if (t.dataset.unchip) { if (t.dataset.unchip === 'q') { S.ev.q = ''; $('#q').value = ''; } else { S.ev.f[t.dataset.unchip] = ''; $$('[data-f="' + t.dataset.unchip + '"]').forEach((s) => (s.value = '')); } renderResults(); return; }
  if (t.dataset.cc !== undefined && t.closest('#cchips')) { S.about.cc = t.dataset.cc; aboutPanel(); Motion.swap($('#side')); return; }
  const a = t.dataset.act;
  if (a === 'clear') { S.ev.f = { spec: '', cc: '', year: '', type: '' }; S.ev.q = ''; $$('[data-f]').forEach((s) => (s.value = '')); const q = $('#q'); if (q) q.value = ''; renderResults(); }
  if (a === 'sheet') Motion.sheet(true);
  if (a === 'sheet-close') Motion.sheet(false);
  if (a === 'menu') { $('#mmenu').hidden = false; t.setAttribute('aria-expanded', 'true'); $('#mmenu a').focus(); }
  if (a === 'menu-close') { $('#mmenu').hidden = true; $('[data-act="menu"]').focus(); }
  if (a === 'film') Motion.film(true, t);
  if (a === 'film-close') Motion.film(false);
  if (a === 'pause') { PL.paused = !PL.paused; const hr = $('#hero'); hr && hr.classList.toggle('paused', PL.paused); t.textContent = PL.paused ? '▶' : '❚❚'; t.setAttribute('aria-label', PL.paused ? 'Play background video' : 'Pause background video'); PL.paused ? stopStills() : startStills(); }
  if (t.dataset.pc) pcAction(t.dataset.pc, t);
});
document.addEventListener('change', (ev) => {
  const t = ev.target, S = PL.state;
  if (t.dataset.f) { S.ev.f[t.dataset.f] = t.value; $$('[data-f="' + t.dataset.f + '"]').forEach((s) => (s.value = t.value)); renderResults(); }
  if (t.dataset.pcs) pcAction(t.dataset.pcs, t);
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'q') { PL.state.ev.q = ev.target.value; renderResults(); } });
document.addEventListener('submit', (ev) => {
  ev.preventDefault(); const f = ev.target, note = $('#formNote', f), bad = $$('[required]', f).filter((i) => !i.value.trim() || (i.type === 'email' && !/^\S+@\S+\.\S+$/.test(i.value)));
  $$('.fld', f).forEach((l) => l.classList.remove('pl-field-error'));
  if (bad.length) { bad.forEach((i) => i.closest('.fld').classList.add('pl-field-error')); note.innerHTML = '<div class="note" style="background:#FDECEC">Please add ' + bad.map((i) => i.closest('.fld').querySelector('.fl').textContent.toLowerCase()).join(' and ') + '.</div>'; bad[0].focus(); return; }
  const off = PL.raw.offices.find((o) => o.id === (f.office ? f.office.value : 'alexandria')) || PL.raw.offices[0];
  note.innerHTML = '<div class="note">Prototype: nothing was sent. On the live site, Forminator emails the ' + esc(off.city) + ' team (' + esc(off.emails[0]) + ') and shows a confirmation here.</div>';
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { Motion.sheet(false); Motion.film(false); const m = $('#mmenu'); if (m && !m.hidden) { m.hidden = true; } } });
window.addEventListener('hashchange', () => { $('#mmenu') && ($('#mmenu').hidden = true); render(); const m = $('#main'); m && m.focus({ preventScroll: true }); });

/* ---- prototype controls (not part of the site) ---- */
function renderControls() {
  const box = $('#pc'); if (!box) return;
  const R = PL.raw, det = Motion.detected();
  box.innerHTML = '<h3>Prototype controls</h3><p class="mut" style="margin:0;font-size:13px">Not part of the site. Everything below changes only the data or the motion context — the pages re-render from the JSON.</p>' +
    '<label class="fld"><span class="fl">Date</span><select class="sel" data-pcs="sim"><option value=""' + (!PL.sim ? ' selected' : '') + '>Today</option><option value="2026-10-31"' + (PL.sim === '2026-10-31' ? ' selected' : '') + '>31 Oct 2026 — during 8th MEOM (Live)</option><option value="2027-01-29"' + (PL.sim === '2027-01-29' ? ' selected' : '') + '>29 Jan 2027 — DEOSS day 1 (Live)</option><option value="2027-06-01"' + (PL.sim === '2027-06-01' ? ' selected' : '') + '>1 Jun 2027 — nothing upcoming</option></select></label>' +
    '<label class="fld"><span class="fl">Motion context (detected: ' + det + ')</span><select class="sel" data-pcs="motion">' + ['auto', 'full', 'light', 'reduced'].map((m) => '<option value="' + m + '"' + (PL.motionOverride === m ? ' selected' : '') + '>' + m[0].toUpperCase() + m.slice(1) + '</option>').join('') + '</select></label>' +
    '<label class="fld"><span class="fl">Home headline (from Company settings)</span><select class="sel" data-pcs="headline">' + HEADLINES.map((h) => '<option value="' + h.id + '"' + (heroHL().id === h.id ? ' selected' : '') + '>' + esc(h.text + ' ' + h.em) + '</option>').join('') + '</select></label>' +
    '<label class="ck"><input type="checkbox" data-pcs="sample"' + (PL.showSample ? ' checked' : '') + '> Show “Sample” tags</label>' +
    '<button type="button" class="btn bs sm" data-pc="iris">Replay the iris (Home)</button>' +
    '<h3 style="margin-top:6px">Data test (DoD)</h3><p style="margin:0;font-size:13px"><strong>' + plural(D.evs.length, 'event') + ' · ' + plural(D.countries.length, 'country', 'countries') + ' · ' + plural(D.cities.length, 'city', 'cities') + '</strong> on the site now. Untick “Show on site” or add a row — map, calendar, grid, tabs and counts all follow.</p>' +
    '<button type="button" class="btn ' + (PL.sampleOn ? 'bs' : 'bp') + ' sm" data-pc="sampleEv">' + (PL.sampleOn ? 'Remove the sample event (Amman, Jordan)' : 'Add a sample event in a new country (Amman, Jordan)') + '</button>' +
    '<div class="evlist">' + R.events.map((e) => '<label class="ck"><input type="checkbox" data-pcs="ev" value="' + esc(e.id) + '"' + (PL.removed.has(e.id) ? '' : ' checked') + '> ' + esc(e.name) + ' <span class="mut">(' + esc(e.city) + ')</span></label>').join('') + '</div>';
}
function pcAction(k, t) {
  if (k === 'toggle') { const p = $('#pc'); p.hidden = !p.hidden; t.setAttribute('aria-expanded', String(!p.hidden)); return; }
  if (k === 'sim') { PL.sim = t.value; render(true); }
  if (k === 'motion') { PL.motionOverride = t.value; render(true); }
  if (k === 'headline') { PL.headline = t.value; render(true); }
  if (k === 'sample') { PL.showSample = t.checked; render(true); }
  if (k === 'ev') { t.checked ? PL.removed.delete(t.value) : PL.removed.add(t.value); render(true); }
  if (k === 'sampleEv') { PL.sampleOn = !PL.sampleOn; render(true); }
  if (k === 'iris') { try { sessionStorage.removeItem('plIris'); } catch (e) {} if (location.hash && location.hash !== '#home') location.hash = '#home'; else render(); }
  const b = $('.pc-btn'); $('#pc').hidden = false; b && b.setAttribute('aria-expanded', 'true');
}

/* ---- boot ---- */
fetch('data/pl-data.json').then((r) => r.json()).then((j) => { PL.raw = j; render(); })
  .catch(() => { $('#main').innerHTML = '<div class="wrap" style="padding:80px 20px"><h1 class="h2">The data file could not load.</h1><p class="lead">Open the prototype from its published link so data/pl-data.json is served next to it.</p></div>'; });

});
</script>
